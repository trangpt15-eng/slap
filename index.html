<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Super Slapper - Choose Your Target!</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Fonts: Fredoka & Bangers -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bangers&family=Fredoka:wght@500;600;700;800&display=swap" rel="stylesheet">

  <style>
    body {
      font-family: 'Fredoka', cursive, sans-serif;
      touch-action: manipulation;
      user-select: none;
      -webkit-user-select: none;
    }

    .comic-font {
      font-family: 'Bangers', cursive, sans-serif;
      letter-spacing: 0.05em;
    }

    /* Severe head recoil animations */
    @keyframes getSlappedLeft {
      0% { transform: scale(1) rotate(0deg); }
      18% { transform: scale(0.85, 1.15) translate(-46px, 14px) rotate(-28deg); }
      42% { transform: scale(1.18, 0.86) translate(28px, -8px) rotate(18deg); }
      68% { transform: scale(0.96, 1.04) translate(-12px, 3px) rotate(-7deg); }
      85% { transform: scale(1.02, 0.99) translate(4px, 0px) rotate(2deg); }
      100% { transform: scale(1) rotate(0deg); }
    }

    @keyframes getSlappedRight {
      0% { transform: scale(1) rotate(0deg); }
      18% { transform: scale(0.85, 1.15) translate(46px, 14px) rotate(28deg); }
      42% { transform: scale(1.18, 0.86) translate(-28px, -8px) rotate(-18deg); }
      68% { transform: scale(0.96, 1.04) translate(12px, 3px) rotate(7deg); }
      85% { transform: scale(1.02, 0.99) translate(-4px, 0px) rotate(-2deg); }
      100% { transform: scale(1) rotate(0deg); }
    }

    .slapped-left {
      animation: getSlappedLeft 0.44s cubic-bezier(0.16, 1, 0.3, 1.25);
    }

    .slapped-right {
      animation: getSlappedRight 0.44s cubic-bezier(0.16, 1, 0.3, 1.25);
    }

    /* Hand impact swooping in */
    @keyframes handSlapRight {
      0% {
        opacity: 0;
        transform: translate(240px, -110px) rotate(50deg) scale(1.6);
      }
      42% {
        opacity: 1;
        transform: translate(-30px, 15px) rotate(-12deg) scale(1.25);
      }
      72% {
        opacity: 0.95;
        transform: translate(12px, -3px) rotate(4deg) scale(1.03);
      }
      100% {
        opacity: 0;
        transform: translate(100px, -45px) rotate(25deg) scale(0.65);
      }
    }

    @keyframes handSlapLeft {
      0% {
        opacity: 0;
        transform: translate(-240px, -110px) rotate(-50deg) scaleX(-1) scale(1.6);
      }
      42% {
        opacity: 1;
        transform: translate(30px, 15px) rotate(12deg) scaleX(-1) scale(1.25);
      }
      72% {
        opacity: 0.95;
        transform: translate(-12px, -3px) rotate(-4deg) scaleX(-1) scale(1.03);
      }
      100% {
        opacity: 0;
        transform: translate(-100px, -45px) rotate(-25deg) scaleX(-1) scale(0.65);
      }
    }

    .hand-slap-right {
      animation: handSlapRight 0.36s cubic-bezier(0.2, 0.9, 0.3, 1) forwards;
    }

    .hand-slap-left {
      animation: handSlapLeft 0.36s cubic-bezier(0.2, 0.9, 0.3, 1) forwards;
    }

    /* Floating comic words popup */
    @keyframes popTextBounce {
      0% {
        opacity: 0;
        transform: translate(-50%, 20px) scale(0.3) rotate(var(--rot, -12deg));
      }
      35% {
        opacity: 1;
        transform: translate(-50%, -40px) scale(1.4) rotate(var(--rot, -12deg));
      }
      70% {
        opacity: 1;
        transform: translate(-50%, -75px) scale(1.1) rotate(var(--rot, -12deg));
      }
      100% {
        opacity: 0;
        transform: translate(-50%, -115px) scale(0.8) rotate(var(--rot, -12deg));
      }
    }

    .comic-pop {
      position: absolute;
      pointer-events: none;
      animation: popTextBounce 0.7s cubic-bezier(0.18, 0.89, 0.32, 1.28) forwards;
      text-shadow: 3px 3px 0 #000, -2px -2px 0 #000, 2px -2px 0 #000, -2px 2px 0 #000, 0 4px 10px rgba(0,0,0,0.4);
    }

    /* Flying stars particles */
    @keyframes starFly {
      0% {
        opacity: 1;
        transform: translate(0, 0) scale(1) rotate(0deg);
      }
      100% {
        opacity: 0;
        transform: translate(var(--tx), var(--ty)) scale(0.2) rotate(var(--tr));
      }
    }

    .star-particle {
      position: absolute;
      pointer-events: none;
      font-size: 26px;
      animation: starFly 0.6s ease-out forwards;
    }

    /* Screen shake */
    @keyframes shakeScreen {
      0% { transform: translate(0, 0); }
      20% { transform: translate(-8px, 6px) rotate(-1deg); }
      40% { transform: translate(8px, -6px) rotate(1deg); }
      60% { transform: translate(-5px, -3px); }
      80% { transform: translate(4px, 3px); }
      100% { transform: translate(0, 0); }
    }

    .screen-shake {
      animation: shakeScreen 0.22s ease-in-out;
    }

    .character-card {
      transition: all 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    .character-card.active {
      transform: translateY(-4px) scale(1.05);
      border-color: #f97316;
      box-shadow: 0 10px 20px -3px rgba(249, 115, 22, 0.35);
      background: white;
    }
  </style>
</head>
<body class="min-h-screen bg-gradient-to-br from-amber-100 via-orange-100 to-rose-200 flex flex-col items-center justify-between p-2.5 sm:p-5 select-none overflow-x-hidden">

  <!-- Header & Title -->
  <header class="w-full max-w-xl flex flex-col items-center z-10 gap-2.5 mt-0.5">
    <div class="inline-flex items-center gap-2.5 bg-white/95 backdrop-blur-md px-6 py-2 rounded-full shadow-lg border-2 border-orange-400">
      <span class="text-3xl animate-bounce">💥</span>
      <h1 class="text-2xl sm:text-3xl font-black text-amber-950 uppercase tracking-widest comic-font">SUPER SLAPPER</h1>
      <span class="text-3xl animate-bounce">👋</span>
    </div>

    <!-- Character Selector Tab: "Who do you want to slap?" -->
    <div class="w-full bg-white/90 backdrop-blur-md px-3 sm:px-4 py-2.5 rounded-3xl shadow-md border-2 border-orange-300 flex flex-col items-center gap-2">
      <div class="flex items-center justify-between w-full px-2">
        <span class="text-xs sm:text-sm font-black uppercase text-amber-900 tracking-wider flex items-center gap-1.5">
          <span>🎯</span> WHO DO YOU WANT TO SLAP?
        </span>
        <span id="targetNameBadge" class="text-xs font-black text-white bg-rose-500 px-2.5 py-0.5 rounded-full uppercase tracking-wide">
          Target: Minh
        </span>
      </div>

      <!-- 2 Character Cards: Minh & Khang -->
      <div class="grid grid-cols-2 gap-3 sm:gap-4 w-full">
        <!-- Option 1: Minh -->
        <button 
          id="tab-minh" 
          onclick="selectCharacter('minh')"
          class="character-card active flex flex-col items-center p-2.5 rounded-2xl border-2 border-orange-400 bg-orange-50/70 hover:bg-white cursor-pointer relative"
        >
          <div class="w-14 h-14 sm:w-16 sm:h-16 rounded-full overflow-hidden bg-amber-100 border-2 border-amber-300 p-0.5 shadow-sm">
            <img src="1.png" alt="Minh" class="w-full h-full object-contain">
          </div>
          <span class="text-sm sm:text-base font-extrabold text-amber-950 mt-1">Minh</span>
          <span id="minh-count" class="text-xs font-bold text-rose-600 bg-rose-100 px-2.5 py-0.5 rounded-full mt-0.5">0 hits</span>
        </button>

        <!-- Option 2: Khang -->
        <button 
          id="tab-khang" 
          onclick="selectCharacter('khang')"
          class="character-card flex flex-col items-center p-2.5 rounded-2xl border-2 border-orange-200 bg-white/70 hover:bg-white cursor-pointer relative"
        >
          <div class="w-14 h-14 sm:w-16 sm:h-16 rounded-full overflow-hidden bg-amber-100 border-2 border-amber-300 p-0.5 shadow-sm">
            <img src="3.png" alt="Khang" class="w-full h-full object-contain">
          </div>
          <span class="text-sm sm:text-base font-extrabold text-amber-950 mt-1">Khang</span>
          <span id="khang-count" class="text-xs font-bold text-amber-700 bg-amber-100 px-2.5 py-0.5 rounded-full mt-0.5">0 hits</span>
        </button>
      </div>
    </div>

    <!-- Stats & Combo Tracker -->
    <div class="w-full bg-white/90 backdrop-blur-md px-5 py-2.5 rounded-3xl shadow-md border-2 border-orange-300/80 flex items-center justify-between gap-3">
      <!-- Target Slap Count -->
      <div class="flex flex-col items-start min-w-[70px]">
        <span class="text-[11px] uppercase font-extrabold text-orange-500 tracking-wider">Slaps</span>
        <div id="slapCount" class="comic-font text-4xl sm:text-5xl font-black text-rose-600 leading-none">0</div>
      </div>

      <!-- Combo Bar -->
      <div class="flex-1 max-w-[190px] flex flex-col items-center">
        <div class="w-full flex justify-between text-[11px] font-bold text-amber-900 mb-1">
          <span>COMBO SPARK</span>
          <span id="comboMultiplier">x1.0</span>
        </div>
        <div class="w-full h-3 bg-amber-200 rounded-full overflow-hidden p-0.5 border border-amber-300">
          <div id="comboBar" class="h-full bg-gradient-to-r from-yellow-400 via-orange-500 to-red-500 rounded-full transition-all duration-150 w-0"></div>
        </div>
        <span id="comboStreakText" class="text-[10px] font-black text-amber-700 uppercase mt-0.5 tracking-tight">Keep smacking!</span>
      </div>

      <!-- Rank Badge -->
      <div class="flex flex-col items-end text-right">
        <span class="text-[11px] uppercase font-extrabold text-amber-600 tracking-wider">Rank</span>
        <div id="rankTitle" class="text-xs sm:text-sm font-extrabold text-amber-950 bg-amber-100/90 border border-amber-300 px-3 py-1 rounded-xl shadow-inner mt-0.5 max-w-[130px] sm:max-w-none truncate">
          Smiling Cheek
        </div>
      </div>
    </div>
  </header>

  <!-- Big Stage: Scaled up to 520px container for maximum impact -->
  <main 
    id="stageContainer" 
    class="relative w-full max-w-[470px] sm:max-w-[530px] aspect-square flex items-center justify-center my-auto cursor-pointer active:scale-95 transition-transform duration-75"
    title="Click anywhere on the face to SLAP!"
  >
    <!-- Background Halo Glow -->
    <div class="absolute inset-2 sm:inset-4 rounded-full bg-gradient-to-tr from-amber-400/35 via-orange-400/30 to-rose-400/40 blur-3xl -z-10 animate-pulse"></div>

    <!-- Extra Large Character Container -->
    <div id="boyWrapper" class="relative w-[92%] h-[92%] flex items-center justify-center transition-transform duration-75">
      <img 
        id="characterImg" 
        src="1.png" 
        alt="Target Character" 
        class="w-full h-full object-contain filter drop-shadow-2xl pointer-events-none select-none transition-transform"
        draggable="false"
      />

      <!-- Progressive Blush and Bruises (Left & Right cheeks) -->
      <div id="slapBlushLeft" class="absolute w-20 h-14 bg-red-600/0 rounded-full blur-md transition-colors duration-300 pointer-events-none top-[57%] left-[23%]"></div>
      <div id="slapBlushRight" class="absolute w-20 h-14 bg-red-600/0 rounded-full blur-md transition-colors duration-300 pointer-events-none top-[57%] right-[22%]"></div>
      
      <!-- Dizzy Eyes / Stars -->
      <div id="dizzyEyes" class="absolute top-[48%] left-1/2 -translate-x-1/2 flex gap-12 text-2xl opacity-0 transition-opacity duration-300 pointer-events-none">
        <span>💫</span>
        <span>💫</span>
      </div>
    </div>

    <!-- Hand & Impact Star Image (2.png) -->
    <img 
      id="handImg" 
      src="2.png" 
      alt="Slapping Hand" 
      class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[92%] h-[92%] object-contain pointer-events-none opacity-0 z-20 drop-shadow-2xl"
      draggable="false"
    />

    <!-- Comic Words & FX Layer -->
    <div id="effectsLayer" class="absolute inset-0 pointer-events-none overflow-visible z-30"></div>
  </main>

  <!-- Bottom Control Panel -->
  <footer class="w-full max-w-md flex flex-col items-center gap-2.5 mb-1 z-10">
    <!-- Big Action Slap Buttons -->
    <div class="flex items-center gap-2 sm:gap-3.5 w-full justify-center px-1">
      <!-- Slap Left -->
      <button 
        id="btnSlapLeft" 
        class="flex-1 py-3 px-3 bg-gradient-to-b from-amber-400 to-amber-500 hover:from-amber-500 hover:to-amber-600 active:translate-y-1 text-white font-black rounded-2xl shadow-md border-b-4 border-amber-700 transition flex items-center justify-center gap-1 text-sm sm:text-base uppercase tracking-wider">
        <span>👈</span> Left Slap
      </button>

      <!-- Mega Slap (Center) -->
      <button 
        id="btnSlapMain" 
        class="py-3 px-6 sm:px-8 bg-gradient-to-b from-rose-500 to-red-600 hover:from-rose-600 hover:to-red-700 active:translate-y-1 text-white font-black rounded-2xl shadow-xl border-b-4 border-red-800 transition flex items-center justify-center gap-2 text-xl sm:text-2xl uppercase tracking-wider comic-font">
        <span>👋</span> SMACK!
      </button>

      <!-- Slap Right -->
      <button 
        id="btnSlapRight" 
        class="flex-1 py-3 px-3 bg-gradient-to-b from-amber-400 to-amber-500 hover:from-amber-500 hover:to-amber-600 active:translate-y-1 text-white font-black rounded-2xl shadow-md border-b-4 border-amber-700 transition flex items-center justify-center gap-1 text-sm sm:text-base uppercase tracking-wider">
        Right Slap <span>👉</span>
      </button>
    </div>

    <!-- Utility & Shortcuts -->
    <div class="flex items-center justify-between w-full px-2 text-xs text-amber-900 font-bold">
      <button id="toggleSoundBtn" class="flex items-center gap-1.5 bg-white/80 hover:bg-white px-3 py-1.5 rounded-xl border border-amber-300 shadow-sm transition">
        <span id="soundIcon">🔊</span> <span id="soundStatus">Audio: ON</span>
      </button>

      <span class="text-amber-800/80 font-semibold hidden xs:inline">Shortcuts: [Space] or [← / →]</span>

      <button id="resetScoreBtn" class="hover:text-red-600 bg-white/80 hover:bg-white px-3 py-1.5 rounded-xl border border-amber-300 shadow-sm transition">
        Reset Target
      </button>
    </div>
  </footer>

  <script>
    // --- Target Roster & Stats ---
    const characters = {
      minh: {
        id: 'minh',
        name: 'Minh',
        image: '1.png',
        count: 0
      },
      khang: {
        id: 'khang',
        name: 'Khang',
        image: '3.png',
        count: 0
      }
    };

    let activeCharacterKey = 'minh';
    let comboStreak = 0;
    let comboMultiplier = 1;
    let lastSlapTime = 0;
    let isSoundEnabled = true;
    let lastSide = 'right';
    let comboDecayTimer = null;
    let audioCtx = null;

    // DOM Elements
    const characterImg = document.getElementById('characterImg');
    const slapCountEl = document.getElementById('slapCount');
    const rankTitleEl = document.getElementById('rankTitle');
    const comboBar = document.getElementById('comboBar');
    const comboMultiplierEl = document.getElementById('comboMultiplier');
    const comboStreakText = document.getElementById('comboStreakText');
    const boyWrapper = document.getElementById('boyWrapper');
    const handImg = document.getElementById('handImg');
    const effectsLayer = document.getElementById('effectsLayer');
    const stageContainer = document.getElementById('stageContainer');
    const slapBlushLeft = document.getElementById('slapBlushLeft');
    const slapBlushRight = document.getElementById('slapBlushRight');
    const dizzyEyes = document.getElementById('dizzyEyes');
    const targetNameBadge = document.getElementById('targetNameBadge');

    const btnSlapLeft = document.getElementById('btnSlapLeft');
    const btnSlapRight = document.getElementById('btnSlapRight');
    const btnSlapMain = document.getElementById('btnSlapMain');
    const toggleSoundBtn = document.getElementById('toggleSoundBtn');
    const soundIcon = document.getElementById('soundIcon');
    const soundStatus = document.getElementById('soundStatus');
    const resetScoreBtn = document.getElementById('resetScoreBtn');

    // Onomatopoeia texts
    const comicWords = [
      { text: "WHACK!", color: "#EF4444" },
      { text: "SLAP!!", color: "#F97316" },
      { text: "SMACK!", color: "#EC4899" },
      { text: "BAM!", color: "#EAB308" },
      { text: "POW!!", color: "#DC2626" },
      { text: "OUCH!", color: "#8B5CF6" },
      { text: "K.O!", color: "#B91C1C" },
      { text: "CRACK!", color: "#F59E0B" }
    ];

    // Titles Progression
    const rankTiers = [
      { min: 0, title: "Smiling Cheek 😇" },
      { min: 10, title: "Gentle Tap 🤏" },
      { min: 25, title: "Cheek Warmer 🔥" },
      { min: 50, title: "Face Tenderizer 🥩" },
      { min: 100, title: "Thunder Slapper ⚡" },
      { min: 200, title: "Five-Finger Ninja 🥷" },
      { min: 350, title: "Cheek Obliterator 💥" },
      { min: 500, title: "GOD OF SLAP 👑" }
    ];

    // Switch Character Function
    function selectCharacter(key) {
      if (!characters[key]) return;
      activeCharacterKey = key;

      // Update Tab Styles
      ['minh', 'khang'].forEach(cKey => {
        const tabEl = document.getElementById(`tab-${cKey}`);
        if (!tabEl) return;
        if (cKey === key) {
          tabEl.classList.add('active', 'border-orange-400');
          tabEl.classList.remove('border-orange-200');
        } else {
          tabEl.classList.remove('active', 'border-orange-400');
          tabEl.classList.add('border-orange-200');
        }
      });

      // Update image & target badge
      const cur = characters[key];
      characterImg.src = cur.image;
      targetNameBadge.textContent = `Target: ${cur.name}`;

      // Update Display for this target
      slapCountEl.textContent = cur.count;
      updateVisualState();
    }

    // High Quality Procedural Web Audio API Sound Synthesizer
    function playSlapSound(intensity = 1.0) {
      if (!isSoundEnabled) return;

      try {
        if (!audioCtx) {
          const AudioContext = window.AudioContext || window.webkitAudioContext;
          audioCtx = new AudioContext();
        }
        if (audioCtx.state === 'suspended') {
          audioCtx.resume();
        }

        const now = audioCtx.currentTime;

        // 1. Noise Crack
        const bufferSize = audioCtx.sampleRate * 0.07;
        const noiseBuffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
        const output = noiseBuffer.getChannelData(0);
        for (let i = 0; i < bufferSize; i++) {
          output[i] = (Math.random() * 2 - 1) * Math.exp(-i / (bufferSize * 0.28));
        }

        const noise = audioCtx.createBufferSource();
        noise.buffer = noiseBuffer;

        const noiseFilter = audioCtx.createBiquadFilter();
        noiseFilter.type = 'bandpass';
        noiseFilter.frequency.setValueAtTime(1550 + Math.random() * 500, now);
        noiseFilter.Q.setValueAtTime(1.8, now);

        const noiseGain = audioCtx.createGain();
        noiseGain.gain.setValueAtTime(1.4 * intensity, now);
        noiseGain.gain.exponentialRampToValueAtTime(0.01, now + 0.065);

        noise.connect(noiseFilter);
        noiseFilter.connect(noiseGain);
        noiseGain.connect(audioCtx.destination);
        noise.start(now);

        // 2. Heavy Sub Thump
        const osc = audioCtx.createOscillator();
        const oscGain = audioCtx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(220 + Math.random() * 30, now);
        osc.frequency.exponentialRampToValueAtTime(45, now + 0.09);

        oscGain.gain.setValueAtTime(1.0 * intensity, now);
        oscGain.gain.exponentialRampToValueAtTime(0.001, now + 0.09);

        osc.connect(oscGain);
        oscGain.connect(audioCtx.destination);
        osc.start(now);
        osc.stop(now + 0.1);

      } catch (e) {
        console.warn("Audio Context blocked:", e);
      }
    }

    // Hit effects and comic text
    function triggerHitEffects(x, y, side) {
      const containerRect = stageContainer.getBoundingClientRect();
      const posX = x !== null ? x : (containerRect.width / 2 + (side === 'left' ? -70 : 70));
      const posY = y !== null ? y : (containerRect.height / 2 - 20);

      // Comic popup
      const item = comicWords[Math.floor(Math.random() * comicWords.length)];
      const textEl = document.createElement('div');
      textEl.className = 'comic-pop comic-font text-3xl sm:text-5xl font-black select-none z-30';
      textEl.style.color = item.color;
      textEl.style.left = `${posX}px`;
      textEl.style.top = `${posY}px`;
      const randomAngle = (side === 'left' ? -1 : 1) * (Math.floor(Math.random() * 18) + 8);
      textEl.style.setProperty('--rot', `${randomAngle}deg`);
      textEl.textContent = item.text;
      effectsLayer.appendChild(textEl);
      setTimeout(() => textEl.remove(), 700);

      // Star particles
      const starSymbols = ['⭐', '✨', '💫', '💥', '💦'];
      const starCount = 4 + Math.floor(Math.random() * 3);
      for (let i = 0; i < starCount; i++) {
        const p = document.createElement('div');
        p.className = 'star-particle select-none';
        p.textContent = starSymbols[Math.floor(Math.random() * starSymbols.length)];
        p.style.left = `${posX}px`;
        p.style.top = `${posY}px`;

        const angle = Math.random() * Math.PI * 2;
        const distance = 60 + Math.random() * 85;
        const tx = Math.cos(angle) * distance;
        const ty = Math.sin(angle) * distance;
        const tr = (Math.random() * 360) + 'deg';

        p.style.setProperty('--tx', `${tx}px`);
        p.style.setProperty('--ty', `${ty}px`);
        p.style.setProperty('--tr', tr);

        effectsLayer.appendChild(p);
        setTimeout(() => p.remove(), 600);
      }
    }

    // Update visuals based on current character's slaps
    function updateVisualState() {
      const current = characters[activeCharacterKey];
      const count = current.count;

      // Update Rank Title
      let currentTitle = rankTiers[0].title;
      for (const tier of rankTiers) {
        if (count >= tier.min) {
          currentTitle = tier.title;
        }
      }
      rankTitleEl.textContent = currentTitle;

      // Progressive Cheek Blush
      const cheekRedness = Math.min(count / 50, 0.85);
      slapBlushLeft.style.backgroundColor = `rgba(239, 68, 68, ${cheekRedness})`;
      slapBlushRight.style.backgroundColor = `rgba(239, 68, 68, ${cheekRedness})`;

      // Dizzy stars on high slap counts
      dizzyEyes.style.opacity = count >= 40 ? '1' : '0';
    }

    // Combo system
    function handleCombo() {
      const now = Date.now();
      const diff = now - lastSlapTime;
      lastSlapTime = now;

      if (diff < 650) {
        comboStreak++;
      } else {
        comboStreak = 1;
      }

      comboMultiplier = Math.min(1 + Math.floor(comboStreak / 4) * 0.5, 4.0);
      comboMultiplierEl.textContent = `x${comboMultiplier.toFixed(1)}`;
      
      const barPercent = Math.min((comboStreak % 16) * 6.25, 100);
      comboBar.style.width = `${Math.max(barPercent, 15)}%`;

      if (comboStreak > 6) {
        comboStreakText.textContent = `🔥 ${comboStreak} HIT RUSH! 🔥`;
        comboStreakText.classList.add('text-red-600');
      } else {
        comboStreakText.textContent = 'Keep smacking!';
        comboStreakText.classList.remove('text-red-600');
      }

      clearTimeout(comboDecayTimer);
      comboDecayTimer = setTimeout(() => {
        comboStreak = 0;
        comboMultiplier = 1;
        comboMultiplierEl.textContent = 'x1.0';
        comboBar.style.width = '0%';
        comboStreakText.textContent = 'Keep smacking!';
      }, 1400);
    }

    // Slap Action
    function slap(side = null, clientX = null, clientY = null) {
      const chosenSide = side || (lastSide === 'right' ? 'left' : 'right');
      lastSide = chosenSide;

      handleCombo();

      // Update current character's count
      const cur = characters[activeCharacterKey];
      cur.count++;
      slapCountEl.textContent = cur.count;
      document.getElementById(`${cur.id}-count`).textContent = `${cur.count} hits`;

      // Pop number effect
      slapCountEl.style.transform = 'scale(1.35)';
      setTimeout(() => slapCountEl.style.transform = 'scale(1)', 110);

      updateVisualState();
      playSlapSound(Math.min(1.0 + (comboMultiplier - 1) * 0.2, 1.6));

      // Shake screen
      document.body.classList.remove('screen-shake');
      void document.body.offsetWidth;
      document.body.classList.add('screen-shake');

      // Head recoil animation
      boyWrapper.classList.remove('slapped-left', 'slapped-right');
      void boyWrapper.offsetWidth;
      boyWrapper.classList.add(chosenSide === 'left' ? 'slapped-left' : 'slapped-right');

      // Hand slap graphic
      handImg.classList.remove('hand-slap-left', 'hand-slap-right');
      void handImg.offsetWidth;
      handImg.classList.add(chosenSide === 'left' ? 'hand-slap-left' : 'hand-slap-right');

      // FX
      let localX = null;
      let localY = null;
      if (clientX !== null && clientY !== null) {
        const rect = stageContainer.getBoundingClientRect();
        localX = clientX - rect.left;
        localY = clientY - rect.top;
      }
      triggerHitEffects(localX, localY, chosenSide);
    }

    // Click on stage face
    stageContainer.addEventListener('pointerdown', (e) => {
      const rect = stageContainer.getBoundingClientRect();
      const relativeX = e.clientX - rect.left;
      const side = relativeX < rect.width / 2 ? 'left' : 'right';
      slap(side, e.clientX, e.clientY);
    });

    // Buttons
    btnSlapLeft.addEventListener('click', (e) => {
      e.stopPropagation();
      slap('left');
    });

    btnSlapRight.addEventListener('click', (e) => {
      e.stopPropagation();
      slap('right');
    });

    btnSlapMain.addEventListener('click', (e) => {
      e.stopPropagation();
      slap();
    });

    // Audio toggle
    toggleSoundBtn.addEventListener('click', () => {
      isSoundEnabled = !isSoundEnabled;
      soundIcon.textContent = isSoundEnabled ? '🔊' : '🔇';
      soundStatus.textContent = isSoundEnabled ? 'Audio: ON' : 'Audio: OFF';
    });

    // Reset current character's slaps
    resetScoreBtn.addEventListener('click', () => {
      const cur = characters[activeCharacterKey];
      cur.count = 0;
      slapCountEl.textContent = '0';
      document.getElementById(`${cur.id}-count`).textContent = `0 hits`;
      comboStreak = 0;
      comboMultiplier = 1;
      comboMultiplierEl.textContent = 'x1.0';
      comboBar.style.width = '0%';
      updateVisualState();
    });

    // Keyboard bindings
    window.addEventListener('keydown', (e) => {
      if (e.code === 'Space') {
        e.preventDefault();
        slap();
      } else if (e.code === 'ArrowLeft') {
        e.preventDefault();
        slap('left');
      } else if (e.code === 'ArrowRight') {
        e.preventDefault();
        slap('right');
      } else if (e.key === '1') {
        selectCharacter('minh');
      } else if (e.key === '2') {
        selectCharacter('khang');
      }
    });

    // Initialize
    selectCharacter('minh');
  </script>
</body>
</html>
